name: Deploy Web to Firebase Hosting

on:
  push:
    branches:
      - flutterflow

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      - name: Align Dependencies for Flutter 3.24.3
        run: |
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          
          if 'dependency_overrides:' in content:
              content = content.split('dependency_overrides:')[0]
          
          overrides = '''
          dependency_overrides:
            meta: 1.15.0
            intl: 0.19.0
            collection: 1.18.0
            device_info_plus: 10.1.0
            url_launcher_web: 2.3.0
            google_fonts: 6.2.1
            http: 1.2.1
          '''
          with open('pubspec.yaml', 'w') as f:
              f.write(content.strip() + '\n' + overrides)
          "

      - name: Build Web App
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons

      - name: Create firebase.json
        run: |
          echo '{"hosting":{"public":"build/web","ignore":["firebase.json","**/.*","**/node_modules/**"],"rewrites":[{"source":"**","destination":"/index.html"}]}}' > firebase.json

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AILBEE }}'
          channelId: live
          projectId: ailbee
