name: Deploy Web to Firebase Hosting

on:
  push:
    branches:
      - flutterflow

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - name: Fix Dependency Conflicts
        run: |
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              lines = f.readlines()
          
          clean_lines = []
          skip = False
          for line in lines:
              if line.startswith('dependency_overrides:'):
                  skip = True
                  continue
              if skip and line and not line.startswith(' ') and not line.startswith('\t') and not line.startswith('#'):
                  skip = False
              if not skip:
                  clean_lines.append(line)
          
          clean_lines.append('\ndependency_overrides:\n')
          clean_lines.append('  font_awesome_flutter: ^10.8.0\n')
          
          with open('pubspec.yaml', 'w') as f:
              f.writelines(clean_lines)
          "

      - name: Build Web App
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons

      - name: Create firebase.json
        run: |
          echo '{"hosting":{"public":"build/web","ignore":["firebase.json","**/.*","**/node_modules/**"],"rewrites":[{"source":"**","destination":"/index.html"}]}}' > firebase.json

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AILBEE }}'
          channelId: live
          projectId: ailbee
